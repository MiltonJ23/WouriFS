<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WouriFS — Topologie du Cluster</title>
<style>
:root { --green: #22c55e; --red: #ef4444; --yellow: #eab308; --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding:24px; }
h1 { font-size:1.5rem; margin-bottom:4px; }
.sub { color:var(--muted); font-size:0.875rem; margin-bottom:24px; }
.nodes { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
.card { background:var(--card); border-radius:12px; padding:20px; border:1px solid #334155; position:relative; }
.card-header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
.dot.online { background:var(--green); box-shadow:0 0 8px var(--green); }
.dot.offline { background:var(--red); box-shadow:0 0 8px var(--red); }
.node-id { font-weight:700; font-size:1.1rem; }
.roles { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
.role { background:#334155; color:var(--text); padding:2px 10px; border-radius:999px; font-size:0.75rem; font-weight:600; text-transform:uppercase; }
.info { display:flex; flex-direction:column; gap:6px; font-size:0.85rem; color:var(--muted); }
.info span { font-family:'SF Mono',monospace; color:var(--text); }
.storage-label { display:flex; justify-content:space-between; margin-top:10px; font-size:0.8rem; }
.bar { height:6px; background:#334155; border-radius:3px; margin-top:4px; overflow:hidden; }
.bar-fill { height:100%; background:var(--green); border-radius:3px; transition:width 0.5s; }
.bar-fill.warn { background:var(--yellow); }
.bar-fill.critical { background:var(--red); }
.status-line { font-size:0.75rem; margin-top:10px; display:flex; align-items:center; gap:6px; }
.badge { padding:2px 8px; border-radius:4px; font-weight:600; font-size:0.7rem; text-transform:uppercase; }
.badge.online { background:#14532d; color:var(--green); }
.badge.offline { background:#7f1d1d; color:var(--red); }
.refresh { text-align:right; font-size:0.7rem; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>
<h1>WouriFS — Topologie du Cluster</h1>
<div class="sub">Actualisé automatiquement toutes les 10 secondes</div>
<div class="nodes" id="nodes"><div style="color:var(--muted);padding:40px;">Connexion au Namenode...</div></div>
<div class="refresh" id="refreshInfo"></div>

<script>
async function fetchTopology() {
  try {
    const r = await fetch('/api/v1/admin/topology');
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    renderNodes(data.nodes);
    document.getElementById('refreshInfo').textContent = 'Dernière actualisation : ' + new Date().toLocaleTimeString('fr-FR');
  } catch {
    document.getElementById('nodes').innerHTML = '<div style="color:var(--red);padding:40px;">Impossible de contacter le Namenode</div>';
  }
}

function renderNodes(nodes) {
  const el = document.getElementById('nodes');
  if (!nodes || nodes.length === 0) {
    el.innerHTML = '<div style="color:var(--muted);padding:40px;">Aucun nœud enregistré</div>';
    return;
  }
  el.innerHTML = nodes.map(n => {
    const online = n.available;
    const usedPct = n.storage_total_bytes > 0 ? (n.storage_used_bytes / n.storage_total_bytes * 100) : 0;
    const barClass = usedPct > 90 ? 'critical' : usedPct > 70 ? 'warn' : '';
    const usedGB = (n.storage_used_bytes / 1073741824).toFixed(1);
    const totalGB = (n.storage_total_bytes / 1073741824).toFixed(1);
    return '<div class="card">' +
      '<div class="card-header">' +
        '<div class="dot ' + (online ? 'online' : 'offline') + '"></div>' +
        '<div class="node-id">' + esc(n.node_id) + '</div>' +
      '</div>' +
      '<div class="roles">' + (n.roles || []).map(r => '<span class="role">' + esc(r) + '</span>').join('') + '</div>' +
      '<div class="info">' +
        '<div>IP Tailscale : <span>' + esc(n.tailscale_ip || 'N/D') + ':' + (n.port || 0) + '</span></div>' +
        '<div>Dernier heartbeat : <span>' + (n.last_heartbeat_unix ? new Date(n.last_heartbeat_unix * 1000).toLocaleTimeString('fr-FR') : 'jamais') + '</span></div>' +
        '<div>Sessions FUSE : <span>' + (n.fuse_sessions || 0) + '</span></div>' +
      '</div>' +
      '<div class="storage-label"><span>Stockage</span><span>' + usedGB + ' / ' + totalGB + ' Go</span></div>' +
      '<div class="bar"><div class="bar-fill ' + barClass + '" style="width:' + usedPct + '%"></div></div>' +
      '<div class="status-line">' +
        '<span class="badge ' + (online ? 'online' : 'offline') + '">' + (online ? 'En ligne' : 'Injoignable') + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

function esc(s) { return String(s).replace(/[&<>"']/g, function(m) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }

fetchTopology();
setInterval(fetchTopology, 10000);
</script>
</body>
</html>
