syntax = "proto3";

package wourifs.namenode.v1;

option go_package = "github.com/MiltonJ23/WouriFS/api/gen/v1/namenode;pb";

service NameNodeService {
  // DataNode lifecycle
  rpc RegisterDataNode(RegisterDataNodeRequest) returns (RegisterDataNodeResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // File & directory operations
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc LookupFile(LookupFileRequest) returns (LookupFileResponse);
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);
  rpc MakeDirectory(MakeDirectoryRequest) returns (MakeDirectoryResponse);
  rpc RemoveDirectory(RemoveDirectoryRequest) returns (RemoveDirectoryResponse);
  rpc RenameFile(RenameFileRequest) returns (RenameFileResponse);
  rpc StatFile(StatFileRequest) returns (StatFileResponse);
  rpc TruncateFile(TruncateFileRequest) returns (TruncateFileResponse);

  // Chunk allocation
  rpc AllocateChunk(AllocateChunkRequest) returns (AllocateChunkResponse);
}

// --- DataNode lifecycle messages ---

message RegisterDataNodeRequest {
  string datanode_id = 1;
  string address = 2;
  int64 total_storage_bytes = 3;
  int64 free_storage_bytes = 4;
}

message RegisterDataNodeResponse {}

message HeartbeatRequest {
  string datanode_id = 1;
  int64 free_storage_bytes = 2;
  int32 active_connections = 3;
}

message HeartbeatResponse {
  bool acknowledged = 1;
  bool require_reregistration = 2;
}

// --- File operation messages ---

message ChunkLocation {
  string chunk_id = 1;
  string datanode_address = 2;
}

message CreateFileRequest {
  string path = 1;
  uint32 mode = 2; // POSIX permission bits (default 0644)
}

message CreateFileResponse {
  string file_id = 1;
}

message DeleteFileRequest {
  string path = 1;
}

message DeleteFileResponse {}

message LookupFileRequest {
  string path = 1;
}

message LookupFileResponse {
  string file_id = 1;
  repeated ChunkLocation chunks = 2;
  int64 size_bytes = 3;
  uint32 mode = 4;
  int64 mtime_unix = 5;
}

message ListDirectoryRequest {
  string path = 1;
}

message DirEntry {
  string name = 1;
  bool is_dir = 2;
  int64 size_bytes = 3;
  uint32 mode = 4;
  int64 mtime_unix = 5;
}

message ListDirectoryResponse {
  repeated DirEntry entries = 1;
}

message MakeDirectoryRequest {
  string path = 1;
  uint32 mode = 2; // default 0755
}

message MakeDirectoryResponse {}

message RemoveDirectoryRequest {
  string path = 1;
}

message RemoveDirectoryResponse {}

message RenameFileRequest {
  string old_path = 1;
  string new_path = 2;
}

message RenameFileResponse {}

message StatFileRequest {
  string path = 1;
}

message StatFileResponse {
  string file_id = 1;
  string name = 2;
  int64 size_bytes = 3;
  uint32 mode = 4;
  bool is_dir = 5;
  int64 mtime_unix = 6;
  int64 ctime_unix = 7;
}

message TruncateFileRequest {
  string path = 1;
  int64 size_bytes = 2; // 0 = truncate to zero
}

message TruncateFileResponse {}

// --- Chunk allocation ---

message AllocateChunkRequest {
  string file_id = 1;
  int32 chunk_index = 2;
  int32 replication_factor = 3;
}

message AllocateChunkResponse {
  string chunk_id = 1;
  repeated string datanode_addresses = 2;
}
