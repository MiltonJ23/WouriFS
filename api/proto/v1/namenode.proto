syntax = "proto3";

package wourifs.namenode.v1;

option go_package = "github.com/MiltonJ23/WouriFS/internal/transport/grpc/pb;pb";

service NameNodeService {
  // DataNode registering at launch (FR-D-007)
  rpc RegisterDataNode(RegisterDataNodeRequest) returns (RegisterDataNodeResponse);

  // Periodic Heartbeat to tell it is alive (FR-D-003)
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message RegisterDataNodeRequest {
  string datanode_id = 1;          // A unique UUID generated by the Datanode on first startup
  string address = 2;              // listening Tailscale address(ex: 100.x.x.x:9001)
  int64 total_storage_bytes = 3;   // total storage capacity allocated
  int64 free_storage_bytes = 4;    // Storage space that is free
}

message RegisterDataNodeResponse {
  bool success = 1;
  string error_message = 2;        // Displayed only if `success` is `false`
}

message HeartbeatRequest {
  string datanode_id = 1;
  int64 free_storage_bytes = 2;    // Update of the free space
  int32 active_connections = 3;    // Optional: useful for future load balancing
}

message HeartbeatResponse {
  bool acknowledged = 1;           // true if the namenode tryly processed the Heartbeat
  //Design Pattern "Amnesia Recovery" : If the Namenode restarts, it loses its RAM registry. It can use this flag to instruct an unknown Datanode to send a RegisterDataNodeRequest.
  bool require_reregistration = 2;
}